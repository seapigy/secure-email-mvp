name: Website Freeze Check
on:
  pull_request:
    paths:
      - 'website/**'
  push:
    paths:
      - 'website/**'

jobs:
  check-website-freeze:
    runs-on: ubuntu-latest
    outputs:
      blocked: ${{ steps.check.outputs.blocked }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for website changes
        id: check
        run: |
          # For PR events, check against base branch
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.base_ref }}"
            git fetch origin $BASE_REF || true
            CHANGED=$(git diff --name-only origin/$BASE_REF -- website/ || true)
          else
            # For push events, check against previous commit
            CHANGED=$(git diff --name-only HEAD~1 -- website/ || true)
          fi
          
          if [ -z "$CHANGED" ]; then
            echo "No website changes detected."
            echo "blocked=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Detected changes in website/: $CHANGED"
          
          # Check PR labels (only available on PR events)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            LABELS=$(jq -r '.pull_request.labels[].name' <<< "${{ toJson(github.event) }}" 2>/dev/null || true)
            echo "Labels: $LABELS"
            if echo "$LABELS" | grep -q "website-edit-approved"; then
              echo "Approved label present. Allowing changes."
              echo "blocked=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          echo "blocked=true" >> $GITHUB_OUTPUT
          echo "::error::Website directory is frozen. To change website files:"
          echo "::error::1. Open a GitHub Issue using .github/ISSUE_TEMPLATE/website-change-request.md"
          echo "::error::2. Get approval from @seapigy/website-owners"
          echo "::error::3. An authorized approver will apply the 'website-edit-approved' label to your PR"
          echo "::error::4. Required label: website-edit-approved"
          exit 1

      - name: Website Freeze Status
        if: steps.check.outputs.blocked == 'true'
        run: |
          echo "::notice::Website changes blocked. See error messages above for approval process."
