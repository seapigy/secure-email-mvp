name: Website CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/auth/core-signup ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: website/package-lock.json
    
    - name: Install website dependencies
      run: |
        cd website
        npm ci
    
    - name: Run website tests
      run: |
        cd website
        npm test -- --run
    
    - name: Build website
      run: |
        cd website
        npm run build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: website-build
        path: website/dist/
        retention-days: 7

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: website-build
        path: website/dist/
    
    - name: Deploy to production
      run: |
        echo "Website ready for deployment"
        echo "Build artifacts available in website/dist/"