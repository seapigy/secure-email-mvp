name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: |
          website/package-lock.json
          frontend/package-lock.json
    
    - name: Install website dependencies
      run: |
        cd website
        npm ci
    
    - name: Run website tests
      run: |
        cd website
        npm test
    
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Run frontend tests
      run: |
        cd frontend
        npm test
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Install Go dependencies
      run: |
        cd backend
        go mod download
    
    - name: Run Go tests
      run: |
        cd backend
        go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker images
      run: |
        docker build -t securemail-backend ./backend
        docker build -t securemail-frontend ./frontend
        docker build -t securemail-website ./website
    
    - name: Push to registry
      if: github.ref == 'refs/heads/main'
      run: |
        echo "Push to production registry"
